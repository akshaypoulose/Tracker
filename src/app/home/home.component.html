<div class="row">
  <div class="col-lg-2">
    <app-sidebar></app-sidebar>
  </div>
  <div class="col-lg-10">
    <!-- home page -->

    <div class="container mt-3">
  <h2>💰 Personal Finance Tracker</h2>

  <div class="summary">
    <div>Income: ₹{{ totalIncome }}</div>
    <div>Expense: ₹{{ totalExpense }}</div>
    <div>Balance: ₹{{ balance }}</div>
  </div>

  <form [formGroup]="transactionForm" (ngSubmit)="onSubmit()">
    <label>Amount*</label>
    <input type="number" formControlName="amount" />
    <div *ngIf="transactionForm.get('amount')?.invalid && transactionForm.get('amount')?.touched" class="error">
      Required and must be positive
    </div>

    <label>Type*</label>
    <div>
      <label><input type="radio" formControlName="type" value="Income" /> Income</label>
      <label><input type="radio" formControlName="type" value="Expense" /> Expense</label>
    </div>
    
<!-- category -->
   <div class="mt-3">
        <label>Category*</label>
        <select formControlName="category">
          <option value="" disabled>Select category</option>
          <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
        </select>
   </div>
<!-- date -->
    <div class="mt-3">
        <label>Date*</label>
        <input type="date" formControlName="date" />
    </div>
<!-- Description -->
    <div class="mt-3">
      <label>Description</label>
      <textarea formControlName="description"></textarea>
    </div>
<!-- buttons -->
    <button  type="submit">{{ editingId ? 'Update' : 'Add' }}</button>
  </form>
  <br>

<h3>Transactions</h3>
<ul>
  <li *ngFor="let t of transactions">
    <div class="transaction-info">
      <span>{{ t.type }}</span>
      <span>{{ t.category }}</span>
      <span>₹{{ t.amount }}</span>
      <span>{{ t.date }}</span>
    </div>
    <div class="transaction-actions">
      <button (click)="editTransaction(t)">Edit</button>
      <button (click)="deleteTransaction(t)">Delete</button>
    </div>
  </li>
</ul>

</div>

  </div>

</div>
